name: Deploy to Homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Cloudflare Tunnel
        uses: and-fm/cloudflared-ssh-action@v3
        with:
          host: ${{ secrets.HOMELAB_HOST }}
          username: ${{ secrets.HOMELAB_USER }}
          private_key_filename: deploy_key
          private_key_value: ${{ secrets.HOMELAB_SSH_KEY }}
          port: 22
          service_token_id: ${{ secrets.CF_CLIENT_ID }}
          service_token_secret: ${{ secrets.CF_CLIENT_SECRET }}
          commands: |
            cd /repo/DnBoxes &&
            git pull origin main &&
            docker compose up -d --build
